[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineagent"
version = "0.1.0"
description = "Autonomous detection-and-repair agent for data pipelines, with an evidence-first dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25", "google-cloud-storage>=2.16"]
agent = ["anthropic>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
pipelineagent = "pipelineagent.cli:main"
proofgate = "pipelineagent.agent.gate:main"

[tool.setuptools.packages.find]
include = ["pipelineagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["agent_e2e: spawns the replay/gate subprocesses; excluded when the gate re-runs the suite"]
